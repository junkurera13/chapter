<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title></title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
    </style>
    <script>
      (() => {
        const appOrigin = "https://sidequest-b44.vercel.app";
        const params = new URLSearchParams(window.location.search);
        const accessToken = params.get("access_token");

        // If a popup lands here with a token, hand it to the Vercel opener.
        if (accessToken) {
          if (window.opener && !window.opener.closed) {
            try {
              window.opener.postMessage(
                {
                  access_token: accessToken,
                  source: "sidequest-bridge",
                  is_new_user: params.get("is_new_user"),
                },
                appOrigin,
              );
              window.close();
              return;
            } catch (e) {
              // fall through to redirect
            }
          }
          const destination = new URL("/app", appOrigin);
          destination.searchParams.set("access_token", accessToken);
          const isNewUser = params.get("is_new_user");
          if (isNewUser != null) {
            destination.searchParams.set("is_new_user", isNewUser);
          }
          window.location.replace(destination.toString());
          return;
        }

        // Default: send people to the real product.
        const destination = new URL(
          window.location.pathname === "/" ? "/" : window.location.pathname,
          appOrigin,
        );
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.toString());
      })();
    </script>
  </head>
  <body></body>
</html>
